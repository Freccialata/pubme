<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Accesso</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f6f2; --fg: #1d1d1b; --muted: #77756f; --line: #d9d6cd; --accent: #1d1d1b; --accent-fg: #f7f6f2; --error: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecebe6; --muted: #9a988f; --line: #3a3935; --accent: #ecebe6; --accent-fg: #161615; --error: #f2b8b5; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, sans-serif; }
  form { width: min(100%, 320px); display: grid; gap: 12px; }
  input[type=password] { width: 100%; padding: 12px 14px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 10px; }
  input[type=password]:focus { outline: 2px solid var(--fg); outline-offset: 1px; }
  label.remember { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
  button { padding: 12px; font: inherit; font-weight: 600; color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: progress; }
  output { min-height: 1.4em; font-size: 14px; color: var(--muted); }
  output.error { color: var(--error); }
</style>
</head>
<body>
<form id="unlock" hidden>
  <input type="password" id="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required autofocus>
  <label class="remember"><input type="checkbox" id="remember"> Ricorda su questo dispositivo</label>
  <button type="submit">Apri</button>
  <output id="status" aria-live="polite"></output>
</form>
<script type="module">
// Mirrors the payload layout written by scripts/encrypt.mjs.
const MAGIC = 'PUB1', HEADER_LENGTH = 36, STORAGE_KEY = 'pubme-key';
const $ = (id) => document.getElementById(id);
const form = $('unlock'), status = $('status'), submit = form.querySelector('button');

const storage = {
  get() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; } },
  set(value) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); } catch {} },
  clear() { try { localStorage.removeItem(STORAGE_KEY); } catch {} },
};
const toBase64 = (bytes) => btoa(String.fromCharCode(...bytes));
const fromBase64 = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));

let payload;
async function loadPayload() {
  if (payload) return payload;
  const response = await fetch('payload.bin', { cache: 'no-cache' });
  if (!response.ok) throw new Error(`payload.bin: HTTP ${response.status}`);
  const bytes = new Uint8Array(await response.arrayBuffer());
  const header = bytes.subarray(0, HEADER_LENGTH);
  if (new TextDecoder().decode(header.subarray(0, 4)) !== MAGIC) throw new Error('Formato del pacchetto non riconosciuto');
  return payload = {
    header, ciphertext: bytes.subarray(HEADER_LENGTH),
    iterations: new DataView(header.buffer, header.byteOffset).getUint32(4),
    salt: header.subarray(8, 24), iv: header.subarray(24, 36),
  };
}

async function keyFromPassword(password, { salt, iterations }) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}

async function decrypt(key) {
  const { header, ciphertext, iv } = await loadPayload();
  const compressed = await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: header }, key, ciphertext);
  return new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}

function show(html) {
  document.open();
  document.write(html);
  document.close();
}

// A remembered key is tied to the payload's salt: a new deploy invalidates it.
async function tryRemembered() {
  const saved = storage.get();
  if (!saved) return false;
  try {
    const { salt } = await loadPayload();
    if (saved.salt !== toBase64(salt)) throw new Error('stale');
    show(await decrypt(await crypto.subtle.importKey('raw', fromBase64(saved.key), 'AES-GCM', false, ['decrypt'])));
    return true;
  } catch { storage.clear(); return false; }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  submit.disabled = true;
  status.className = '';
  status.textContent = 'Apertura…';
  let key, html;
  try {
    key = await keyFromPassword($('password').value, await loadPayload());
    html = await decrypt(key);
  } catch (error) {
    submit.disabled = false;
    status.className = 'error';
    status.textContent = error.name === 'OperationError' ? 'Password errata.' : `Errore: ${error.message}`;
    return;
  }
  if ($('remember').checked) storage.set({ salt: toBase64(payload.salt), key: toBase64(new Uint8Array(await crypto.subtle.exportKey('raw', key))) });
  show(html);
});

if (!(await tryRemembered())) form.hidden = false;
</script>
</body>
</html>
